name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you got. Paste the full error / traceback if there is one.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `bench version` (Frappe, ERPNext, PDC Management).
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Hosting
      options:
        - Frappe Cloud
        - Self-hosted
    validations:
      required: true
